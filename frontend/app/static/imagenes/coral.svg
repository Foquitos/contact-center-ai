<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Coral, el asistente de ayuda">
  <title>Coral</title>
  <!--
    Mascota del asistente de ayuda (ver templates/partials/asistente_manual.html).
    Versión de color fijo, para usarla con <img> sobre fondo claro. La versión que
