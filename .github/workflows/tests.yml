# Suite offline (sin gastar tokens de IA) contra la base de demostración en SQL Server.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Demo_ContactCenter_2026
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Driver ODBC 18 y ffmpeg
        run: |
          sudo apt-get update
          # Los runners de GitHub suelen traer el repositorio de Microsoft configurado; si no, se agrega.
          if ! sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
          sudo apt-get install -y ffmpeg unixodbc

      - name: Dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # torch sin CUDA: los tests no usan GPU y la versión de PyPI pesa varios GB.
          .venv/bin/pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt

      - name: Base de demostración (esquema y migraciones)
        run: |
          cp .env.example .env
          .venv/bin/python db/crear_base_demo.py --sin-datos

      - name: Tests
        run: |
          set -o pipefail
          scripts/correr_tests.sh -m "not tokens" 2>&1 | tee pytest.log
      - name: Resumen de fallas
        if: failure()
        run: |
          # Cada test fallido queda como anotación de la corrida (se ven sin abrir el log).
          # GitHub muestra hasta 10 anotaciones por paso: primero el resumen y las causas distintas.
          tail -1 pytest.log | while read -r linea; do echo "::error::${linea:0:900}"; done
          grep -E "^E  " pytest.log | sort | uniq -c | sort -rn | head -5 | while read -r linea; do echo "::error::${linea:0:900}"; done
          grep -E "^(FAILED|ERROR) " pytest.log | head -4 | while read -r linea; do echo "::error::${linea:0:900}"; done
